name: alpha10-stable-oklab-saturation-experiment
on:
  push:
    branches: [feature/sony-creative-look]
    paths: [.github/workflows/alpha10-fma-experiment.yml]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Install native dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libraw-dev liblcms2-dev libexiv2-dev libjpeg-dev libgl-dev libegl-dev libopengl-dev libvulkan-dev libxkbcommon-dev libxcb-cursor0 xvfb mesa-utils
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          modules: qtshadertools
          cache: true
      - name: Apply homogeneous high-range Oklab normalization in checkout only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('core/pipeline/ImagePipeline.cpp')
          t=p.read_text()
          marker='''inline float wrapHue(float degrees) {\n'''
          helper='''inline Oklab stableHighRangeOklab(Vec3 rgb) {\n    // Oklab is homogeneous of degree 1/3. Divide bright scene-linear values\n    // by 8^n (exact binary scaling), transform in a well-conditioned range,\n    // then multiply Lab by 2^n. This is algebraically the same transform.\n    const float maximum=std::max({std::fabs(rgb.x),std::fabs(rgb.y),std::fabs(rgb.z)});\n    float rgbScale=1.0f,labScale=1.0f;\n    for(int i=0;i<8 && maximum>rgbScale;++i){rgbScale*=8.0f;labScale*=2.0f;}\n    Oklab lab=linearSrgbToOklab(scale(rgb,1.0f/rgbScale));\n    lab.L*=labScale;lab.a*=labScale;lab.b*=labScale;\n    return lab;\n}\ninline Vec3 oklabScaledChromaToLinearSrgb(Oklab c, float gain) {\n    const Vec3 chroma{0.0f,c.a,c.b};\n    const Vec3 d{\n        orderedDot(0.0f,0.3963377774f,0.2158037573f,chroma),\n        orderedDot(0.0f,-0.1055613458f,-0.0638541728f,chroma),\n        orderedDot(0.0f,-0.0894841775f,-1.2914855480f,chroma)};\n    const Vec3 d2{d.x*d.x,d.y*d.y,d.z*d.z};\n    const Vec3 d3{d2.x*d.x,d2.y*d.y,d2.z*d.z};\n    const float L2=c.L*c.L,L3=L2*c.L;\n    auto channel=[&](float x,float y,float z){\n        const float c1=3.0f*L2*orderedDot(x,y,z,d);\n        const float c2=3.0f*c.L*orderedDot(x,y,z,d2);\n        const float c3=orderedDot(x,y,z,d3);\n        return L3+gain*(c1+gain*(c2+gain*c3));\n    };\n    return {channel(4.0767416621f,-3.3077115913f,0.2309699292f),\n            channel(-1.2684380046f,2.6097574011f,-0.3413193965f),\n            channel(-0.0041960863f,-0.7034186147f,1.7076147010f)};\n}\n'''
          if t.count(marker)!=1: raise SystemExit('CPU helper marker mismatch')
          t=t.replace(marker,helper+marker,1)
          old='''    if (state.hue==0 && noBands) {\n        const float c = chromaLength(lab.a,lab.b);\n        const float gain = std::max(0.0f,1.0f+float(state.saturation/100))\n            * std::max(0.0f,1.0f+float(state.vibrance/100)*(1.0f-clamp01(c/.30f))*.85f);\n        lab.L = std::clamp(lab.L,0.0f,labLimit);\n        lab.a *= gain; lab.b *= gain;\n        return oklabToLinearSrgb(lab);\n    }\n'''
          new='''    if (state.hue==0 && noBands) {\n        lab=stableHighRangeOklab(linearSrgb);\n        const float c=chromaLength(lab.a,lab.b);\n        const float gain=std::max(0.0f,1.0f+float(state.saturation/100))\n            * std::max(0.0f,1.0f+float(state.vibrance/100)*(1.0f-clamp01(c/.30f))*.85f);\n        lab.L=std::clamp(lab.L,0.0f,labLimit);\n        return oklabScaledChromaToLinearSrgb(lab,gain);\n    }\n'''
          if t.count(old)!=1: raise SystemExit('CPU branch mismatch')
          p.write_text(t.replace(old,new,1))

          p=Path('shaders/pipeline.comp')
          t=p.read_text()
          marker='''float wrapHue(float h) { return h-floor(h/360.0)*360.0; }\n'''
          helper='''vec3 stableHighRangeLab(vec3 rgb) {\n    float maximum=max(abs(rgb.r),max(abs(rgb.g),abs(rgb.b)));\n    float rgbScale=1.0,labScale=1.0;\n    for(int i=0;i<8;++i){if(maximum>rgbScale){rgbScale*=8.0;labScale*=2.0;}}\n    return toLab(rgb/rgbScale)*labScale;\n}\nvec3 fromLabScaledChroma(vec3 c,float gain) {\n    precise vec3 d=vec3(\n        dot3(vec3(0.0,.3963377774,.2158037573),c),\n        dot3(vec3(0.0,-.1055613458,-.0638541728),c),\n        dot3(vec3(0.0,-.0894841775,-1.2914855480),c));\n    precise vec3 d2=d*d;\n    precise vec3 d3=d2*d;\n    precise float L2=c.x*c.x,L3=L2*c.x;\n    precise vec3 c1=3.0*L2*vec3(\n        dot3(vec3(4.0767416621,-3.3077115913,.2309699292),d),\n        dot3(vec3(-1.2684380046,2.6097574011,-.3413193965),d),\n        dot3(vec3(-.0041960863,-.7034186147,1.7076147010),d));\n    precise vec3 c2=3.0*c.x*vec3(\n        dot3(vec3(4.0767416621,-3.3077115913,.2309699292),d2),\n        dot3(vec3(-1.2684380046,2.6097574011,-.3413193965),d2),\n        dot3(vec3(-.0041960863,-.7034186147,1.7076147010),d2));\n    precise vec3 c3=vec3(\n        dot3(vec3(4.0767416621,-3.3077115913,.2309699292),d3),\n        dot3(vec3(-1.2684380046,2.6097574011,-.3413193965),d3),\n        dot3(vec3(-.0041960863,-.7034186147,1.7076147010),d3));\n    return vec3(L3)+gain*(c1+gain*(c2+gain*c3));\n}\n'''
          if t.count(marker)!=1: raise SystemExit('GPU helper marker mismatch')
          t=t.replace(marker,helper+marker,1)
          old='''    if(p[5].x==0.0 && noBands) {\n        float c=chromaLength(lab.yz);\n        float gain=max(0.0,1.0+p[4].z)*max(0.0,1.0+p[4].w*(1.0-clamp(c/.30,0.0,1.0))*.85);\n        lab.x=clamp(lab.x,0.0,p[33].w);lab.yz*=gain;\n        return fromLab(lab);\n    }\n'''
          new='''    if(p[5].x==0.0 && noBands) {\n        lab=stableHighRangeLab(c);\n        float chroma=chromaLength(lab.yz);\n        float gain=max(0.0,1.0+p[4].z)*max(0.0,1.0+p[4].w*(1.0-clamp(chroma/.30,0.0,1.0))*.85);\n        lab.x=clamp(lab.x,0.0,p[33].w);\n        return fromLabScaledChroma(lab,gain);\n    }\n'''
          if t.count(old)!=1: raise SystemExit('GPU branch mismatch')
          p.write_text(t.replace(old,new,1))
          PY
          git diff --check
      - name: Build GPU and performance tests
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target JixelLightGpuTests JixelLightPerformanceTests --parallel 4
      - name: Run GPU correctness
        env:
          QT_QPA_PLATFORM: offscreen
          LIBGL_ALWAYS_SOFTWARE: '1'
          JIXELLIGHT_REQUIRE_GPU: '1'
        run: |
          set +e
          xvfb-run -a ./build/bin/JixelLightGpuTests -o stable-gpu.txt,txt
          gpu=$?
          ./build/bin/JixelLightPerformanceTests -o stable-performance.txt,txt
          perf=$?
          cat stable-gpu.txt
          cat stable-performance.txt
          test $gpu -eq 0 -a $perf -eq 0
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha10-stable-oklab-results
          path: |
            stable-gpu.txt
            stable-performance.txt
          if-no-files-found: error
