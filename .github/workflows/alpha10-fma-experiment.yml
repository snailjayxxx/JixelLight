name: alpha10-deterministic-tonal-experiment
on:
  push:
    branches: [feature/sony-creative-look]
    paths: [.github/workflows/alpha10-fma-experiment.yml]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Install native dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libraw-dev liblcms2-dev libexiv2-dev libjpeg-dev libgl-dev libegl-dev libopengl-dev libvulkan-dev libxkbcommon-dev libxcb-cursor0 xvfb mesa-utils
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          modules: qtshadertools
          cache: true
      - name: Apply deterministic tonal exp2 and stable saturation reconstruction in checkout only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('core/pipeline/ImagePipeline.cpp')
          t=p.read_text()
          marker='''inline float smooth(float x) { x = clamp01(x); return x * x * (3.0f - 2.0f * x); }\n'''
          helper='''inline float deterministicExp2(float x) {\n    // Range-reduced exp2 with an explicit seventh-order exp polynomial.\n    // The integer power-of-two scale is exact; CPU/GPU execute the same\n    // Horner sequence instead of backend-specific exp2 implementations.\n    const int n=int(std::floor(x+0.5f));\n    const float f=x-float(n);\n    float p=0.0000152527338f;\n    p=0.000154035304f+f*p;\n    p=0.00133335581f+f*p;\n    p=0.00961812911f+f*p;\n    p=0.0555041087f+f*p;\n    p=0.240226507f+f*p;\n    p=0.693147181f+f*p;\n    p=1.0f+f*p;\n    float scale=1.0f;\n    if(n>0) for(int i=0;i<n;++i) scale*=2.0f;\n    else for(int i=0;i>n;--i) scale*=0.5f;\n    return scale*p;\n}\n'''
          if t.count(marker)!=1: raise SystemExit('CPU exp2 marker mismatch')
          t=t.replace(marker,marker+helper,1)
          old='''        v = scale(v, std::exp2(stops));\n'''
          new='''        v = scale(v, deterministicExp2(stops));\n'''
          if t.count(old)!=1: raise SystemExit('CPU tonal exp2 site mismatch')
          t=t.replace(old,new,1)
          marker='''inline float wrapHue(float degrees) {\n'''
          helper='''inline Vec3 oklabScaledChromaToLinearSrgb(Oklab c, float gain) {\n    const Vec3 chroma{0.0f,c.a,c.b};\n    const Vec3 d{orderedDot(0.0f,0.3963377774f,0.2158037573f,chroma),\n                 orderedDot(0.0f,-0.1055613458f,-0.0638541728f,chroma),\n                 orderedDot(0.0f,-0.0894841775f,-1.2914855480f,chroma)};\n    const Vec3 d2{d.x*d.x,d.y*d.y,d.z*d.z};\n    const Vec3 d3{d2.x*d.x,d2.y*d.y,d2.z*d.z};\n    const float L2=c.L*c.L,L3=L2*c.L;\n    auto channel=[&](float x,float y,float z){\n        const float c1=3.0f*L2*orderedDot(x,y,z,d);\n        const float c2=3.0f*c.L*orderedDot(x,y,z,d2);\n        const float c3=orderedDot(x,y,z,d3);\n        return L3+gain*(c1+gain*(c2+gain*c3));\n    };\n    return {channel(4.0767416621f,-3.3077115913f,0.2309699292f),\n            channel(-1.2684380046f,2.6097574011f,-0.3413193965f),\n            channel(-0.0041960863f,-0.7034186147f,1.7076147010f)};\n}\n'''
          if t.count(marker)!=1: raise SystemExit('CPU saturation helper marker mismatch')
          t=t.replace(marker,helper+marker,1)
          old='''        lab.L = std::clamp(lab.L,0.0f,labLimit);\n        lab.a *= gain; lab.b *= gain;\n        return oklabToLinearSrgb(lab);\n'''
          new='''        lab.L = std::clamp(lab.L,0.0f,labLimit);\n        return oklabScaledChromaToLinearSrgb(lab,gain);\n'''
          if t.count(old)!=1: raise SystemExit('CPU saturation branch mismatch')
          p.write_text(t.replace(old,new,1))

          p=Path('shaders/pipeline.comp')
          t=p.read_text()
          marker='''float smooth01(float x) { x=clamp(x,0.0,1.0); return x*x*(3.0-2.0*x); }\n'''
          helper='''float deterministicExp2(float x) {\n    int n=int(floor(x+0.5));\n    float f=x-float(n);\n    precise float q=0.0000152527338;\n    q=0.000154035304+f*q;\n    q=0.00133335581+f*q;\n    q=0.00961812911+f*q;\n    q=0.0555041087+f*q;\n    q=0.240226507+f*q;\n    q=0.693147181+f*q;\n    q=1.0+f*q;\n    float scale=1.0;\n    if(n>0) for(int i=0;i<n;++i) scale*=2.0;\n    else for(int i=0;i>n;--i) scale*=0.5;\n    return scale*q;\n}\n'''
          if t.count(marker)!=1: raise SystemExit('GPU exp2 marker mismatch')
          t=t.replace(marker,marker+helper,1)
          old='''        v*=exp2(stops);\n'''
          new='''        v*=deterministicExp2(stops);\n'''
          if t.count(old)!=1: raise SystemExit('GPU tonal exp2 site mismatch')
          t=t.replace(old,new,1)
          marker='''float wrapHue(float h) { return h-floor(h/360.0)*360.0; }\n'''
          helper='''vec3 fromLabScaledChroma(vec3 c,float gain) {\n    precise vec3 d=vec3(dot3(vec3(0.0,.3963377774,.2158037573),c),\n                        dot3(vec3(0.0,-.1055613458,-.0638541728),c),\n                        dot3(vec3(0.0,-.0894841775,-1.2914855480),c));\n    precise vec3 d2=d*d;\n    precise vec3 d3=d2*d;\n    precise float L2=c.x*c.x,L3=L2*c.x;\n    precise vec3 c1=3.0*L2*vec3(dot3(vec3(4.0767416621,-3.3077115913,.2309699292),d),\n        dot3(vec3(-1.2684380046,2.6097574011,-.3413193965),d),dot3(vec3(-.0041960863,-.7034186147,1.7076147010),d));\n    precise vec3 c2=3.0*c.x*vec3(dot3(vec3(4.0767416621,-3.3077115913,.2309699292),d2),\n        dot3(vec3(-1.2684380046,2.6097574011,-.3413193965),d2),dot3(vec3(-.0041960863,-.7034186147,1.7076147010),d2));\n    precise vec3 c3=vec3(dot3(vec3(4.0767416621,-3.3077115913,.2309699292),d3),\n        dot3(vec3(-1.2684380046,2.6097574011,-.3413193965),d3),dot3(vec3(-.0041960863,-.7034186147,1.7076147010),d3));\n    return vec3(L3)+gain*(c1+gain*(c2+gain*c3));\n}\n'''
          if t.count(marker)!=1: raise SystemExit('GPU saturation helper marker mismatch')
          t=t.replace(marker,helper+marker,1)
          old='''        lab.x=clamp(lab.x,0.0,p[33].w);lab.yz*=gain;\n        return fromLab(lab);\n'''
          new='''        lab.x=clamp(lab.x,0.0,p[33].w);\n        return fromLabScaledChroma(lab,gain);\n'''
          if t.count(old)!=1: raise SystemExit('GPU saturation branch mismatch')
          p.write_text(t.replace(old,new,1))
          PY
          git diff --check
      - name: Build GPU and performance tests
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target JixelLightGpuTests JixelLightPerformanceTests --parallel 4
      - name: Run correctness
        env:
          QT_QPA_PLATFORM: offscreen
          LIBGL_ALWAYS_SOFTWARE: '1'
          JIXELLIGHT_REQUIRE_GPU: '1'
        run: |
          set +e
          xvfb-run -a ./build/bin/JixelLightGpuTests -o gpu.txt,txt
          gpu=$?
          ./build/bin/JixelLightPerformanceTests -o perf.txt,txt
          perf=$?
          cat gpu.txt
          cat perf.txt
          test $gpu -eq 0 -a $perf -eq 0
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha10-deterministic-tonal-results
          path: |
            gpu.txt
            perf.txt
          if-no-files-found: error
