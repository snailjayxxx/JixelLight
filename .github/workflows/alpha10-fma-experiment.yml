name: alpha10-fma-experiment
on:
  push:
    branches: [feature/sony-creative-look]
    paths: [.github/workflows/alpha10-fma-experiment.yml]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Install native dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libraw-dev liblcms2-dev libexiv2-dev libjpeg-dev libgl-dev libegl-dev libopengl-dev libvulkan-dev libxkbcommon-dev libxcb-cursor0 xvfb mesa-utils
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          modules: qtshadertools
          cache: true
      - name: Apply explicit FMA experiment in checkout only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('core/pipeline/ImagePipeline.cpp')
          t=p.read_text()
          old='''inline float orderedDot(float ax, float ay, float az, Vec3 v) {\n    // Match shader dot3: one explicitly ordered XY sum followed by Z.\n    const float xy = ax * v.x + ay * v.y;\n    return xy + az * v.z;\n}\n'''
          new='''inline float orderedDot(float ax, float ay, float az, Vec3 v) {\n    // Explicitly fused in the same order as the compute shader.\n    return std::fma(az, v.z, std::fma(ax, v.x, ay * v.y));\n}\n'''
          if t.count(old)!=1: raise SystemExit('CPU orderedDot marker mismatch')
          p.write_text(t.replace(old,new))
          p=Path('shaders/pipeline.comp')
          t=p.read_text()
          old='''float dot3(vec3 a, vec3 b) {\n    precise float result=(a.x*b.x+a.y*b.y)+a.z*b.z;\n    return result;\n}\n'''
          new='''float dot3(vec3 a, vec3 b) {\n    precise float result=fma(a.z,b.z,fma(a.x,b.x,a.y*b.y));\n    return result;\n}\n'''
          if t.count(old)!=1: raise SystemExit('GPU dot3 marker mismatch')
          p.write_text(t.replace(old,new))
          PY
          git diff --check
      - name: Build GPU tests
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target JixelLightGpuTests --parallel 4
      - name: Run GPU correctness
        env:
          QT_QPA_PLATFORM: offscreen
          LIBGL_ALWAYS_SOFTWARE: '1'
          JIXELLIGHT_REQUIRE_GPU: '1'
        run: |
          set +e
          xvfb-run -a ./build/bin/JixelLightGpuTests -o fma-results.txt,txt
          status=$?
          cat fma-results.txt
          exit $status
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha10-fma-results
          path: fma-results.txt
          if-no-files-found: error
