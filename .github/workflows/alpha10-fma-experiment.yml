name: alpha10-oklab-inverse-order-experiment
on:
  push:
    branches: [feature/sony-creative-look]
    paths: [.github/workflows/alpha10-fma-experiment.yml]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Install native dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libraw-dev liblcms2-dev libexiv2-dev libjpeg-dev libgl-dev libegl-dev libopengl-dev libvulkan-dev libxkbcommon-dev libxcb-cursor0 xvfb mesa-utils
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          modules: qtshadertools
          cache: true
      - name: Match shader Oklab inverse root ordering to CPU
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('shaders/pipeline.comp')
          t=p.read_text()
          old='''vec3 fromLab(vec3 c) {\n    precise vec3 a=vec3(c.x+.3963377774*c.y+.2158037573*c.z,c.x-.1055613458*c.y-.0638541728*c.z,c.x-.0894841775*c.y-1.2914855480*c.z);\n    a=a*a*a;\n'''
          new='''vec3 fromLab(vec3 c) {\n    precise vec3 a=vec3(\n        dot3(vec3(1.0,.3963377774,.2158037573),c),\n        dot3(vec3(1.0,-.1055613458,-.0638541728),c),\n        dot3(vec3(1.0,-.0894841775,-1.2914855480),c));\n    a=a*a*a;\n'''
          if t.count(old)!=1: raise SystemExit('fromLab root marker mismatch')
          p.write_text(t.replace(old,new))
          PY
          git diff --check
      - name: Build GPU tests
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target JixelLightGpuTests --parallel 4
      - name: Run GPU correctness
        env:
          QT_QPA_PLATFORM: offscreen
          LIBGL_ALWAYS_SOFTWARE: '1'
          JIXELLIGHT_REQUIRE_GPU: '1'
        run: |
          set +e
          xvfb-run -a ./build/bin/JixelLightGpuTests -o inverse-results.txt,txt
          status=$?
          cat inverse-results.txt
          exit $status
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha10-oklab-inverse-results
          path: inverse-results.txt
          if-no-files-found: error
