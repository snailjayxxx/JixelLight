name: source-snapshot
on:
  push:
    branches: ['perf/20260907-a-e']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Archive exact source and history
        shell: bash
        run: |
          git archive --format=zip HEAD -o JixelLight-source.zip
          git bundle create JixelLight-history.bundle HEAD
          git rev-parse HEAD > SOURCE_COMMIT.txt
          sha256sum JixelLight-source.zip JixelLight-history.bundle > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: JixelLight-source-${{ github.sha }}
          path: |
            JixelLight-source.zip
            JixelLight-history.bundle
            SOURCE_COMMIT.txt
            SHA256SUMS.txt
          retention-days: 14
