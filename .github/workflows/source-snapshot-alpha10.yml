name: alpha10-apply-base-render
on:
  push:
    branches: [feature/sony-creative-look]
    paths: [.github/workflows/source-snapshot-alpha10.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Apply verified alpha.10 RAW base-render patch
        run: |
          python3 - <<'PY'
          import base64, hashlib, lzma, os, pathlib, subprocess
          expected_base='0538ef022d3b7e520971da419cdcce1baad7083a'
          base=subprocess.check_output(['git','rev-parse','HEAD^^'],text=True).strip()
          if base != expected_base:
              raise SystemExit(f'Unexpected source base {base}; refusing concurrent overwrite')
          previous=subprocess.check_output(['git','show','HEAD^:.github/workflows/source-snapshot-alpha10.yml'],text=True)
          lines=previous.splitlines(); start=next(i for i,l in enumerate(lines) if 'PATCH_B64: |' in l)
          chunks=[]
          for line in lines[start+1:]:
              if line.startswith('    steps:'): break
              chunks.append(line.strip())
          patch=lzma.decompress(base64.b64decode(''.join(chunks)))
          if hashlib.sha256(patch).hexdigest() != '5de64bb702de92d61ee3e92d9e12bbf73105197520e9a4b30e65c28814401f60':
              raise SystemExit('Patch checksum mismatch')
          path=pathlib.Path(os.environ['RUNNER_TEMP'])/'alpha10.patch'; path.write_bytes(patch)
          subprocess.run(['git','apply','--check','--index',str(path)],check=True)
          subprocess.run(['git','apply','--index',str(path)],check=True)
          changed=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          expected={
            'CMakeLists.txt','README.md','app/LookController.cpp','core/look/LookCalibration.cpp',
            'core/pipeline/ImagePipeline.cpp','core/pipeline/ProcessingPlan.h',
            'docs/SONY_CREATIVE_LOOK.md','docs/SONY_REAL_VALIDATION.md',
            'shaders/pipeline.comp','tests/CoreTests.cpp','tests/LegacyPipeline.cpp','tests/SonyLookTests.cpp'
          }
          if set(changed) != expected:
              raise SystemExit('Unexpected staged paths: '+repr(changed))
          print('Verified alpha.10 patch:',len(changed),'files')
          PY
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: add deterministic RAW base rendering and invalidate stale fitted looks'
          git push origin HEAD:refs/heads/feature/sony-creative-look
