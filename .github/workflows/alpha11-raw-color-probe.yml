name: alpha11-raw-color-probe
on:
  push:
    branches: ['fix/alpha11-raw-color-rendering']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: alpha11-raw-color-probe-${{ github.ref }}
  cancel-in-progress: true
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      FIXTURES: ${{ github.workspace }}/.sony-fixtures
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Install native dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libraw-dev liblcms2-dev libexiv2-dev libjpeg-dev libgl-dev libegl-dev libopengl-dev libvulkan-dev libxkbcommon-dev libxcb-cursor0
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          modules: qtshadertools
          cache: true
      - name: Apply probe-only runtime parameter hooks
        run: |
          python tools/Alpha11RawProbePatch.py
          git diff --check
          git diff -- core/raw/RawDecoder.cpp core/pipeline/ImagePipeline.cpp CMakeLists.txt
      - name: Build RAW validation probes
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target JixelLightSonyValidation JixelLightRawEmbeddedProbe --parallel 4
      - name: Fetch checksum-pinned Sony RAW/JPEG fixtures
        run: |
          python tools/FetchSonyFixtures.py tests/fixtures/sony-real-manifest.json "$FIXTURES"
          cp tests/fixtures/sony-real-manifest.json "$FIXTURES/manifest.json"
      - name: Fetch independent Leica DNG fixture
        run: |
          curl -L --fail --retry 3 \
            https://raw.githubusercontent.com/f-spot/raw-samples/master/DNG/RAW_LEICA_M8.DNG \
            -o "$RUNNER_TEMP/JixelLight-Leica-M8.DNG"
          sha256sum "$RUNNER_TEMP/JixelLight-Leica-M8.DNG" | tee leica-sha256.txt
      - name: Run Sony decoder/base-rendering matrix
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p probe-results/sony
          run_variant() {
            name="$1"; thr="$2"; highlight="$3"; ev="$4"
            echo "=== Sony $name : adjust_maximum_thr=$thr highlight=$highlight baseEV=$ev ==="
            mkdir -p "probe-results/sony/$name/dataset"
            env JIXELLIGHT_PROBE_ADJUST_MAXIMUM_THR="$thr" \
                JIXELLIGHT_PROBE_LIBRAW_HIGHLIGHT="$highlight" \
                JIXELLIGHT_PROBE_RAW_BASE_EV="$ev" \
                ./build/bin/JixelLightSonyValidation --dataset \
                "$FIXTURES/manifest.json" "probe-results/sony/$name/dataset" \
                >"probe-results/sony/$name/dataset/stdout.log" 2>&1 || true
          }
          run_variant current       0.00 2 2.50
          run_variant max075_h2     0.75 2 2.50
          run_variant max0_h1       0.00 1 2.50
          run_variant max075_h1     0.75 1 2.50
          run_variant max075_h0     0.75 0 2.50
          run_variant ev0p00        0.75 1 0.00
          run_variant ev0p50        0.75 1 0.50
          run_variant ev1p00        0.75 1 1.00
          run_variant ev1p50        0.75 1 1.50
          run_variant ev2p00        0.75 1 2.00
          run_variant ev2p50        0.75 1 2.50
          run_variant ev3p00        0.75 1 3.00
      - name: Run Leica embedded-preview matrix
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p probe-results/leica
          run_leica() {
            name="$1"; thr="$2"; highlight="$3"; ev="$4"
            echo "=== Leica $name : adjust_maximum_thr=$thr highlight=$highlight baseEV=$ev ==="
            mkdir -p "probe-results/leica/$name"
            env JIXELLIGHT_PROBE_ADJUST_MAXIMUM_THR="$thr" \
                JIXELLIGHT_PROBE_LIBRAW_HIGHLIGHT="$highlight" \
                JIXELLIGHT_PROBE_RAW_BASE_EV="$ev" \
                ./build/bin/JixelLightRawEmbeddedProbe \
                "$RUNNER_TEMP/JixelLight-Leica-M8.DNG" "probe-results/leica/$name" \
                >"probe-results/leica/$name/stdout.log" 2>&1 || true
          }
          run_leica current       0.00 2 2.50
          run_leica max075_h2     0.75 2 2.50
          run_leica max0_h1       0.00 1 2.50
          run_leica max075_h1     0.75 1 2.50
          run_leica max075_h0     0.75 0 2.50
          run_leica ev0p00        0.00 2 0.00
          run_leica ev0p50        0.00 2 0.50
          run_leica ev1p00        0.00 2 1.00
          run_leica ev1p50        0.00 2 1.50
          run_leica ev2p00        0.00 2 2.00
          run_leica ev2p50        0.00 2 2.50
          run_leica ev3p00        0.00 2 3.00
          run_leica ev3p50        0.00 2 3.50
      - name: Summarize probe metrics
        run: |
          python - <<'PY'
          import json, pathlib
          root=pathlib.Path('probe-results')
          sony=[]
          for d in sorted((root/'sony').iterdir()):
              p=d/'dataset'/'dataset-report.json'
              row={'variant':d.name}
              if p.exists():
                  doc=json.loads(p.read_text(encoding='utf-8')); m=doc.get('metrics',{})
                  row.update({'accepted':doc.get('accepted'),'rmseBefore':m.get('heldoutRmseBefore'),'rmseAfter':m.get('heldoutRmseAfter'),'gradientAlignment':m.get('gradientAlignment'),'scenes':m.get('scenes',[])})
              sony.append(row)
          sony.sort(key=lambda r:(r.get('rmseBefore') is None,r.get('rmseBefore',99)))
          leica=[]
          for d in sorted((root/'leica').iterdir()):
              p=d/'report.json'; row={'variant':d.name}
              if p.exists():
                  doc=json.loads(p.read_text(encoding='utf-8')); m=doc.get('fit',{})
                  row.update({'make':doc.get('make'),'model':doc.get('model'),'baseGain':doc.get('baseGain'),'adjustMaximumThr':doc.get('probeAdjustMaximumThr'),'libRawHighlight':doc.get('probeLibRawHighlight'),'referenceKind':doc.get('reference',{}).get('kind'),'rmseBefore':m.get('heldoutRmseBefore'),'rmseAfter':m.get('heldoutRmseAfter'),'gradientAlignment':m.get('gradientAlignment'),'fitAccepted':doc.get('fitAccepted'),'fitError':doc.get('fitError')})
              leica.append(row)
          leica.sort(key=lambda r:(r.get('rmseBefore') is None,r.get('rmseBefore',99)))
          note='Lower pre-fit RMSE means the neutral rendered RAW is closer to the paired/embedded camera preview. It is a diagnostic signal, not proof of a camera-authentic renderer.'
          out={'schema':2,'note':note,'sony':sony,'leica':leica}
          (root/'summary.json').write_text(json.dumps(out,indent=2),encoding='utf-8')
          print(json.dumps(out,indent=2))
          PY
      - name: Upload A/B probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha11-raw-color-probe
          path: |
            probe-results/
            leica-sha256.txt
          retention-days: 14
