name: alpha10-gamut-stability-fix
on:
  push:
    branches: [feature/sony-creative-look]
    paths: [.github/workflows/alpha10-gamut-stability-fix.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Rewrite gamut intersection without near-zero cancellation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          expected='5e81a4ba93fbd35463a08364d67f4d9049b3b66e'
          parent=subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip()
          if parent != expected:
              raise SystemExit(f'Unexpected parent {parent}; refusing concurrent overwrite')

          p=Path('core/pipeline/ImagePipeline.cpp'); t=p.read_text()
          old='''        const float factor = std::clamp(y / (y - minChannel), 0.0f, 1.0f) * inset;\n        rgb.x = y + (rgb.x - y) * factor;\n        rgb.y = y + (rgb.y - y) * factor;\n        rgb.z = y + (rgb.z - y) * factor;\n'''
          new='''        // Algebraically identical to y + (channel-y)*y/(y-min)*inset,\n        // but written as a normalized ratio. For the minimum channel the\n        // ratio is exactly -1 (same operands, reversed subtraction), avoiding\n        // catastrophic cancellation of two nearly equal luminance terms.\n        // This matters after sRGB encoding, where a tiny linear error near zero\n        // is amplified. Keep this arithmetic form in sync with pipeline.comp.\n        const float denominator = y - minChannel;\n        rgb.x = y * (1.0f + ((rgb.x - y) / denominator) * inset);\n        rgb.y = y * (1.0f + ((rgb.y - y) / denominator) * inset);\n        rgb.z = y * (1.0f + ((rgb.z - y) / denominator) * inset);\n'''
          if t.count(old)!=1: raise SystemExit('CPU gamut block not found exactly once')
          p.write_text(t.replace(old,new))

          p=Path('shaders/pipeline.comp'); t=p.read_text()
          old='''        float inset=1.0-.005*smooth01(-smallest/(.005*max(1.0,y)));\n        v=vec3(y)+(v-vec3(y))*(clamp(y/(y-smallest),0.0,1.0)*inset);\n'''
          new='''        float inset=1.0-.005*smooth01(-smallest/(.005*max(1.0,y)));\n        // Same cancellation-resistant form as the CPU. The minimum-channel\n        // ratio becomes exactly -1 instead of subtracting two nearly equal\n        // positive values after the gamut intersection.\n        float denominator=y-smallest;\n        v=vec3(y)*(vec3(1.0)+((v-vec3(y))/denominator)*inset);\n'''
          if t.count(old)!=1: raise SystemExit('GPU gamut block not found exactly once')
          p.write_text(t.replace(old,new))
          PY
          git diff --check
          git diff -- core/pipeline/ImagePipeline.cpp shaders/pipeline.comp
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add core/pipeline/ImagePipeline.cpp shaders/pipeline.comp
          git commit -m 'fix: avoid cancellation at near-zero gamut intersections'
          git push origin HEAD:refs/heads/feature/sony-creative-look
