name: alpha10-apply-final-numeric-fix
on:
  push:
    branches: [feature/sony-creative-look]
    paths: [.github/workflows/alpha10-apply-final-numeric-fix.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Apply validated 2-bit Oklab stability fix
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('core/pipeline/ImagePipeline.cpp')
          t=p.read_text()
          old='#include <cmath>\n'
          new='#include <cmath>\n#include <bit>\n#include <cstdint>\n'
          if t.count(old)!=1: raise SystemExit('CPU include marker mismatch')
          t=t.replace(old,new,1)
          marker='''inline float wrapHue(float degrees) {\n'''
          helper='''inline float snapPerceptualInput(float v) {\n    // Clear only the two least-significant IEEE-754 mantissa bits before the\n    // pure saturation/vibrance Oklab transform. This relative adjustment is\n    // below visible precision, yet removes backend ULP noise that otherwise\n    // gets amplified when a bright RAW color lands close to an RGB gamut edge.\n    if (!std::isfinite(v) || v == 0.0f) return v;\n    const uint32_t word = std::bit_cast<uint32_t>(v) & 0xfffffffcu;\n    return std::bit_cast<float>(word);\n}\ninline Vec3 snapPerceptualInput(Vec3 v) {\n    return {snapPerceptualInput(v.x),snapPerceptualInput(v.y),snapPerceptualInput(v.z)};\n}\ninline Vec3 oklabScaledChromaToLinearSrgb(Oklab c, float gain) {\n    // For a pure saturation/vibrance edit, expand the Oklab inverse as a cubic\n    // in chroma gain. This is algebraically equivalent to scaling a/b and\n    // cubing the three LMS roots, but avoids subtracting large nearly-equal\n    // values when an output RGB channel is close to zero.\n    const Vec3 chroma{0.0f,c.a,c.b};\n    const Vec3 d{\n        orderedDot(0.0f,0.3963377774f,0.2158037573f,chroma),\n        orderedDot(0.0f,-0.1055613458f,-0.0638541728f,chroma),\n        orderedDot(0.0f,-0.0894841775f,-1.2914855480f,chroma)};\n    const Vec3 d2{d.x*d.x,d.y*d.y,d.z*d.z};\n    const Vec3 d3{d2.x*d.x,d2.y*d.y,d2.z*d.z};\n    const float L2=c.L*c.L,L3=L2*c.L;\n    auto channel=[&](float x,float y,float z) {\n        const float c1=3.0f*L2*orderedDot(x,y,z,d);\n        const float c2=3.0f*c.L*orderedDot(x,y,z,d2);\n        const float c3=orderedDot(x,y,z,d3);\n        return L3+gain*(c1+gain*(c2+gain*c3));\n    };\n    return {channel(4.0767416621f,-3.3077115913f,0.2309699292f),\n            channel(-1.2684380046f,2.6097574011f,-0.3413193965f),\n            channel(-0.0041960863f,-0.7034186147f,1.7076147010f)};\n}\n'''
          if t.count(marker)!=1: raise SystemExit('CPU helper marker mismatch')
          t=t.replace(marker,helper+marker,1)
          old='''    if (state.hue==0 && noBands) {\n        const float c = chromaLength(lab.a,lab.b);\n        const float gain = std::max(0.0f,1.0f+float(state.saturation/100))\n            * std::max(0.0f,1.0f+float(state.vibrance/100)*(1.0f-clamp01(c/.30f))*.85f);\n        lab.L = std::clamp(lab.L,0.0f,labLimit);\n        lab.a *= gain; lab.b *= gain;\n        return oklabToLinearSrgb(lab);\n    }\n'''
          new='''    if (state.hue==0 && noBands) {\n        lab = linearSrgbToOklab(snapPerceptualInput(linearSrgb));\n        const float c = chromaLength(lab.a,lab.b);\n        const float gain = std::max(0.0f,1.0f+float(state.saturation/100))\n            * std::max(0.0f,1.0f+float(state.vibrance/100)*(1.0f-clamp01(c/.30f))*.85f);\n        lab.L = std::clamp(lab.L,0.0f,labLimit);\n        return oklabScaledChromaToLinearSrgb(lab,gain);\n    }\n'''
          if t.count(old)!=1: raise SystemExit('CPU pure saturation branch mismatch')
          p.write_text(t.replace(old,new,1))

          p=Path('shaders/pipeline.comp')
          t=p.read_text()
          marker='''float wrapHue(float h) { return h-floor(h/360.0)*360.0; }\n'''
          helper='''float snapPerceptualInput(float v) {\n    if(isnan(v)||isinf(v)||v==0.0) return v;\n    return uintBitsToFloat(floatBitsToUint(v)&0xfffffffcu);\n}\nvec3 snapPerceptualInput(vec3 v) {\n    return vec3(snapPerceptualInput(v.x),snapPerceptualInput(v.y),snapPerceptualInput(v.z));\n}\nvec3 fromLabScaledChroma(vec3 c,float gain) {\n    precise vec3 d=vec3(\n        dot3(vec3(0.0,.3963377774,.2158037573),c),\n        dot3(vec3(0.0,-.1055613458,-.0638541728),c),\n        dot3(vec3(0.0,-.0894841775,-1.2914855480),c));\n    precise vec3 d2=d*d,d3=d2*d;\n    precise float L2=c.x*c.x,L3=L2*c.x;\n    precise vec3 c1=3.0*L2*vec3(\n        dot3(vec3(4.0767416621,-3.3077115913,.2309699292),d),\n        dot3(vec3(-1.2684380046,2.6097574011,-.3413193965),d),\n        dot3(vec3(-.0041960863,-.7034186147,1.7076147010),d));\n    precise vec3 c2=3.0*c.x*vec3(\n        dot3(vec3(4.0767416621,-3.3077115913,.2309699292),d2),\n        dot3(vec3(-1.2684380046,2.6097574011,-.3413193965),d2),\n        dot3(vec3(-.0041960863,-.7034186147,1.7076147010),d2));\n    precise vec3 c3=vec3(\n        dot3(vec3(4.0767416621,-3.3077115913,.2309699292),d3),\n        dot3(vec3(-1.2684380046,2.6097574011,-.3413193965),d3),\n        dot3(vec3(-.0041960863,-.7034186147,1.7076147010),d3));\n    return vec3(L3)+gain*(c1+gain*(c2+gain*c3));\n}\n'''
          if t.count(marker)!=1: raise SystemExit('GPU helper marker mismatch')
          t=t.replace(marker,helper+marker,1)
          old='''    if(p[5].x==0.0 && noBands) {\n        float c=chromaLength(lab.yz);\n        float gain=max(0.0,1.0+p[4].z)*max(0.0,1.0+p[4].w*(1.0-clamp(c/.30,0.0,1.0))*.85);\n        lab.x=clamp(lab.x,0.0,p[33].w);lab.yz*=gain;\n        return fromLab(lab);\n    }\n'''
          new='''    if(p[5].x==0.0 && noBands) {\n        lab=toLab(snapPerceptualInput(c));\n        float chroma=chromaLength(lab.yz);\n        float gain=max(0.0,1.0+p[4].z)*max(0.0,1.0+p[4].w*(1.0-clamp(chroma/.30,0.0,1.0))*.85);\n        lab.x=clamp(lab.x,0.0,p[33].w);\n        return fromLabScaledChroma(lab,gain);\n    }\n'''
          if t.count(old)!=1: raise SystemExit('GPU pure saturation branch mismatch')
          p.write_text(t.replace(old,new,1))

          p=Path('core/pipeline/ProcessingPlan.h')
          t=p.read_text()
          old='static constexpr const char *EngineVersion = "jixellight-linear-v4-base1-look3";'
          new='static constexpr const char *EngineVersion = "jixellight-linear-v4-base1-look4";'
          if t.count(old)!=1: raise SystemExit('EngineVersion marker mismatch')
          p.write_text(t.replace(old,new,1))

          p=Path('tests/GpuTests.cpp')
          t=p.read_text()
          old='''        constexpr quint16 seeds[][3]={{16492,36979,31231},{18743,43453,32369},{20306,54764,34044}};\n        QImage image(257,9,QImage::Format_RGBA64);\n        for(int y=0;y<9;++y) {\n'''
          new='''        constexpr quint16 seeds[][3]={{16492,36979,31231},{18743,43453,32369},{20306,54764,34044},\n                                       {28853,59865,40358},{22323,46996,38591}};\n        QImage image(257,15,QImage::Format_RGBA64);\n        for(int y=0;y<15;++y) {\n'''
          if t.count(old)!=1: raise SystemExit('boundary regression marker mismatch')
          p.write_text(t.replace(old,new,1))
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add core/pipeline/ImagePipeline.cpp core/pipeline/ProcessingPlan.h shaders/pipeline.comp tests/GpuTests.cpp
          git commit -m 'fix: stabilize high-exposure Oklab saturation parity'
          git push origin HEAD:refs/heads/feature/sony-creative-look
