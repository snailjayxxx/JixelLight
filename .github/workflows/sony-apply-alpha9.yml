name: sony-apply-alpha9
on:
  push:
    branches: [feature/sony-creative-look]
    paths: [.github/workflows/sony-apply-alpha9.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'snailjayxxx/JixelLight' && github.ref == 'refs/heads/feature/sony-creative-look'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Apply checksum-verified source patch to the expected parent only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,lzma,os,pathlib,subprocess,urllib.request
          parent=subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip()
          if parent!='5eb6f145fd80055defbb10c8557638896b258690':raise SystemExit('Unexpected parent; refusing to overwrite concurrent edits')
          chunks=[]
          for sha in ['059b0cc36fc15651a45e51190aaa419f7a0152af','909221b132e6d67f6b7231ba727b007c9af01f9b','4e340cacf044865db4a74cc2a700c7f65baf2df5','df36e6263b1d206a35f27d8e89e04112e93498eb']:
              request=urllib.request.Request('https://api.github.com/repos/snailjayxxx/JixelLight/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(request,timeout=45) as response:item=json.load(response)
              if item.get('sha')!=sha or item.get('encoding')!='base64':raise SystemExit('Unexpected blob')
              chunks.append(base64.b64decode(item['content']))
          patch=lzma.decompress(b''.join(chunks))
          if hashlib.sha256(patch).hexdigest()!='9b0290678d28d0fbb6d791f85ec2aab46fe1a3a375c663482d580da84b39c913':raise SystemExit('Patch checksum mismatch')
          file=pathlib.Path(os.environ['RUNNER_TEMP'])/'alpha9.patch';file.write_bytes(patch)
          subprocess.run(['git','apply','--check','--index',str(file)],check=True)
          subprocess.run(['git','apply','--index',str(file)],check=True)
          paths=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          allowed=('.gitignore','CMakeLists.txt','README.md','vcpkg.json','.github/workflows/build.yml','.github/workflows/sony-real-samples.yml')
          if len(paths)!=26 or any(not(p in allowed or p.startswith(('core/','tests/','tools/','docs/','ui/'))) for p in paths):raise SystemExit('Unexpected staged paths')
          print('Source patch verified:',len(paths),'paths')
          PY
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: validate real Sony pairs, normalize camera identity and fit held-out empirical profiles'
          git push origin HEAD:refs/heads/feature/sony-creative-look
          git rev-parse HEAD > SOURCE_COMMIT.txt
          git bundle create alpha9-source.bundle --all
      - uses: actions/upload-artifact@v4
        with:
          name: alpha9-committed-source
          path: |
            SOURCE_COMMIT.txt
            alpha9-source.bundle
          retention-days: 7
