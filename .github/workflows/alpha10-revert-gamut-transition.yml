name: alpha10-revert-gamut-transition
on:
  push:
    branches: [feature/sony-creative-look]
    paths: [.github/workflows/alpha10-revert-gamut-transition.yml]
permissions:
  contents: write
jobs:
  revert:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Revert only the unsuccessful source experiment
        run: |
          test "$(git rev-parse HEAD^)" = "12d7c28bb1edc85d90530dbe7615080e7c198694" || { echo unexpected parent; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git revert --no-edit 71c89f8b09943314a24c3a27b057307975f30f25
          git push origin HEAD:refs/heads/feature/sony-creative-look
