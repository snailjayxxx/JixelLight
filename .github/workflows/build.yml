        env:
          QT_QPA_PLATFORM: xcb
          QSG_RHI_BACKEND: opengl
          LIBGL_ALWAYS_SOFTWARE: '1'
          JIXELLIGHT_REQUIRE_GPU: '1'
        run: |
          xvfb-run -a ./build/bin/JixelLight --smoke-report gui-gpu.json --screenshot gui-gpu.png "$RUNNER_TEMP/test.DNG"
          xvfb-run -a python tools/ValidateDiagnostic.py ./build/bin/JixelLight --mode gpu --cli ./build/bin/JixelLightCli
      - name: GUI CPU fallback
        env:
          QT_QPA_PLATFORM: offscreen
          JIXELLIGHT_FORCE_CPU: '1'
        run: |
          ./build/bin/JixelLight --smoke-report gui-cpu.json "$RUNNER_TEMP/test.DNG"
          python tools/ValidateDiagnostic.py ./build/bin/JixelLight --mode cpu --cli ./build/bin/JixelLightCli
      - name: Print validation summaries
        if: always()
        run: |
          for report in build/*-results.txt gui-*.json build/raw-render-matrix/raw-render-matrix.json build/sensor-evidence.json build/float-raw-readiness.json build/offline-raw-probe.json; do
            if test -f "$report"; then echo "=== $report ==="; cat "$report"; fi
          done
      - name: Upload validation reports
        id: validation_upload
        if: always()
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/upload-artifact@v4
        with:
          name: validation-Linux
          path: ${{ env.JIXELLIGHT_VALIDATION_ARTIFACT_PATHS }}
          if-no-files-found: error
      - name: Upload validation reports transport retry 1
        id: validation_upload_retry
        if: ${{ !cancelled() && (steps.validation_upload.outcome == 'failure' || steps.validation_upload.outcome == 'cancelled') }}
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/upload-artifact@v4
        with:
          name: validation-Linux-transport-retry1
          path: ${{ env.JIXELLIGHT_VALIDATION_ARTIFACT_PATHS }}
          if-no-files-found: error
      - name: Require product success and complete artifact delivery
        if: ${{ always() && !cancelled() }}
        shell: bash
        env:
          JIXELLIGHT_PRIOR_JOB_STATUS: ${{ job.status }}
          JIXELLIGHT_PACKAGE_GATE: ''
          JIXELLIGHT_ARTIFACT_DELIVERY: |
            {
              "validation": {
                "primary": {
                  "outcome": "${{ steps.validation_upload.outcome }}",
                  "id": "${{ steps.validation_upload.outputs.artifact-id }}",
                  "digest": "${{ steps.validation_upload.outputs.artifact-digest }}"
                },
                "retry": {
                  "outcome": "${{ steps.validation_upload_retry.outcome }}",
                  "id": "${{ steps.validation_upload_retry.outputs.artifact-id }}",
                  "digest": "${{ steps.validation_upload_retry.outputs.artifact-digest }}"
                }
              }
            }
        run: |
          python tools/ValidateArtifactDelivery.py --platform "$RUNNER_OS" --prior-job-status "$JIXELLIGHT_PRIOR_JOB_STATUS" --package-gate "$JIXELLIGHT_PACKAGE_GATE" --report artifact-delivery.json
