name: build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
env:
  PYTHONIOENCODING: utf-8
  JIXELLIGHT_SONY_FIXTURES: ${{ github.workspace }}/.sony-fixtures
  JIXELLIGHT_CROSS_RAW_FIXTURES: ${{ github.workspace }}/.cross-raw-fixtures
  JIXELLIGHT_REQUIRE_SONY_REAL: '1'
  JIXELLIGHT_TEST_SONY_PROFILE: ${{ github.workspace }}/build/sony-real-reports/dataset/empirical.jlook.json
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            artifact: JixelLight-Windows-x64
            triplet: x64-windows-static-md
            # CI337 reached90m after its47-mode manifest, cancelling final packaging.
            # Individual GUI and export/reference deadlines remain unchanged.
            job_timeout: 120
          - os: macos-15
            artifact: JixelLight-macOS-arm64
            triplet: arm64-osx-static
            # Run301 completed native validation before the 75-minute aggregate
            # limit interrupted packaging. Individual validation limits stay fixed.
            job_timeout: 180
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.job_timeout }}
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-binaries
      JIXELLIGHT_VALIDATION_ARTIFACT_PATHS: |
        build/*-results.txt
        build/brush-preview-admission-worker-results.json
        build/brush-tile-lowerbound-owned
        build/tangential-geometry-owned
        build/tangential-gpu-owned
        build/grain-owned
        build/sharpen-owned
        build/denoise-owned
        build/clarity-owned
        build/texture-owned
        build/dehaze-owned
        build/color-mask-owned
        build/luminance-mask-owned
        build/point-color-owned
        build/native-brush-monitor.json
        build/xmp-controller-native/
        build/brush-pressure-input/
        build/edit-recipe-native/
        build/qsb-depfile-test/
        build/tests.xml
        build/sony-real-reports/
        build/gpu-preflight-reports/
        build/raw-render-matrix/
        build/sensor-evidence.json
        build/float-raw-readiness.json
        build/offline-raw-probe.json
        build/cross-raw-conformance*
        build/Testing/Temporary/LastTest.log
        gpu-validation.txt
        display-color-gpu-validation.txt
        gui-*.json
        gui-*.png
        gui-*.log
        gui-xmp-merge-*.json.stdout
        gui-xmp-merge-*.json.stderr
        gui-project-menu-layout.json.stdout
        gui-project-menu-layout.json.stderr
        gui-raw-qpa-*
        gui-tangential-*
        gui-denoise-*
        gui-clarity-*
        gui-texture-*
        gui-dehaze-*
        gui-move-import-*
        gui-soft-proof-*
        gui-color-mask-*
        gui-luminance-mask-*
        gui-point-color-*
        diagnostic-validation/
        benchmark.json
        raw-render-matrix.log
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Validate strict artifact-delivery gate
        shell: bash
        run: python -m unittest discover -s tests -p 'TestArtifactDelivery.py' -v
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          modules: qtshadertools qtimageformats
          cache: true
      - name: Checkout vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: 04a9d8e5212d01ee1dd9478eadd9caade4f8b0d4
          path: .vcpkg
          fetch-depth: 1
      - name: Bootstrap vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\.vcpkg\bootstrap-vcpkg.bat -disableMetrics
      - name: Bootstrap vcpkg (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: ./.vcpkg/bootstrap-vcpkg.sh -disableMetrics
      - name: Prepare native dependency cache
        id: dependency-key
        shell: bash
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          echo "vcpkg=$(git -C .vcpkg rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Restore native dependency cache
        id: native-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: native-${{ runner.os }}-${{ matrix.triplet }}-${{ steps.dependency-key.outputs.vcpkg }}-${{ hashFiles('vcpkg.json', 'triplets/**') }}
          restore-keys: |
            native-${{ runner.os }}-${{ matrix.triplet }}-${{ steps.dependency-key.outputs.vcpkg }}-
      - name: Configure
        id: configure
        shell: bash
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/.vcpkg/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}
          -DVCPKG_OVERLAY_TRIPLETS="$GITHUB_WORKSPACE/triplets"
      - name: Save native dependency cache
        if: ${{ !cancelled() && steps.configure.outcome == 'success' && steps.native-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Build
        id: compile
        env:
          UseMultiToolTask: ${{ runner.os == 'Windows' && 'true' || 'false' }}
          EnforceProcessCountAcrossBuilds: ${{ runner.os == 'Windows' && 'true' || 'false' }}
          CL_MPCount: '4'
          MultiProcMaxCount: '4'
        run: cmake --build build --config Release --parallel 4
      - name: Download real RAW test sample
        shell: bash
        run: >-
          curl -L --fail --retry 3
          "https://raw.githubusercontent.com/f-spot/raw-samples/master/DNG/RAW_LEICA_M8.DNG"
          -o "$RUNNER_TEMP/JixelLight-test.DNG"
      - name: Fetch checksum-pinned real Sony ARW and matching JPEG fixtures
        shell: bash
        run: python tools/FetchSonyFixtures.py tests/fixtures/sony-real-manifest.json "$JIXELLIGHT_SONY_FIXTURES"
      - name: Cache pinned CC0 CR3 NEF and RAF fixtures
        uses: actions/cache@v4
        with:
          path: .cross-raw-fixtures
          key: cross-raw-${{ runner.os }}-${{ hashFiles('tests/fixtures/cross-raw.json') }}
      - name: Fetch checksum-pinned CC0 cross-format RAW fixtures
        shell: bash
        run: python tools/FetchCrossRawFixtures.py tests/fixtures/cross-raw.json "$JIXELLIGHT_CROSS_RAW_FIXTURES"
      - name: Real Sony and complete GPU precision preflight
        shell: bash
        env:
          JIXELLIGHT_TEST_RAW: ${{ runner.temp }}/JixelLight-test.DNG
          JIXELLIGHT_REQUIRE_GPU: '1'
        run: |
          python -m unittest discover -s tests -p 'TestGpuPreflight.py' -v
          STAMP=$(git rev-parse HEAD)
          python tools/RunGpuPreflight.py --build build --config Release --report build/gpu-preflight-reports --source-commit "$STAMP"
      - name: Test including real RAW decode and compute parity
        env:
          JIXELLIGHT_TEST_RAW: ${{ runner.temp }}/JixelLight-test.DNG
          JIXELLIGHT_REQUIRE_GPU: '1'
        run: ctest --test-dir build -C Release --output-on-failure --output-junit tests.xml
      - name: Native committed preview delivery monitor and exact Sony export
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            EXE=build/bin/Release/JixelLight.exe
          else
            EXE=$(find build -path '*/JixelLight.app/Contents/MacOS/JixelLight' -type f | head -1)
          fi
          VERIFY=$(find build/bin -type f \( -name JixelLightBrushPressureExportVerifier -o -name JixelLightBrushPressureExportVerifier.exe \) | head -1)
          test -f "$EXE" && test -n "$VERIFY"
          STAMP=$(git rev-parse --short HEAD)
          python -m unittest discover -s tests -p 'TestNativeBrushEvidence.py' -v
          for CASE in route delivery pending retired-render monitor; do
            python tools/ValidateNativeBrush.py "$EXE" "gui-native-brush-$CASE.json" "$CASE" --expected-commit "$STAMP"
          done
          python tools/ValidateNativeBrush.py "$EXE" gui-native-brush-sony.json sony --raw "$JIXELLIGHT_SONY_FIXTURES/sony_a7_iv_07.arw" --verifier "$VERIFY" --expected-commit "$STAMP"
      - name: Bilingual normal-App XMP review and durable import
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            EXE=build/bin/Release/JixelLight.exe
          else
            EXE=$(find build -path '*/JixelLight.app/Contents/MacOS/JixelLight' -type f | head -1)
          fi
          test -f "$EXE"
          STAMP=$(git rev-parse --short HEAD)
          python -m unittest discover -s tests -p 'TestXmpMergeEvidence.py' -v
          for LANGUAGE in en_US zh_CN; do
            python tools/ValidateXmpMerge.py "$EXE" "gui-xmp-merge-$LANGUAGE.json" "$LANGUAGE" --expected-commit "$STAMP"
          done
      - name: Finite raw pressure QPA Paint and Erase
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            EXE=build/bin/Release/JixelLight.exe
          else
            EXE=$(find build -path '*/JixelLight.app/Contents/MacOS/JixelLight' -type f | head -1)
          fi
          test -f "$EXE"
          STAMP=$(git rev-parse --short HEAD)
          python -m unittest discover -s tests -p 'TestRawPressureQpaEvidence.py' -v
          python -m unittest discover -s tests -p 'TestPngUnfilter.py' -v
          python tools/ValidateRawPressureQpa.py "$EXE" gui-raw-qpa-cpu.json cpu --expected-commit "$STAMP"
          python tools/ValidateRawPressureQpa.py "$EXE" gui-raw-qpa-gpu.json gpu --expected-commit "$STAMP"
      - name: Manual tangential geometry complete photo App
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            EXE=build/bin/Release/JixelLight.exe
          else
            EXE=$(find build -path '*/JixelLight.app/Contents/MacOS/JixelLight' -type f | head -1)
          fi
          test -f "$EXE"
          STAMP=$(git rev-parse --short HEAD)
          python -m unittest discover -s tests -p 'TestTangentialGeometryEvidence.py' -v
          python tools/ValidateTangentialGeometry.py "$EXE" gui-tangential-cpu.json cpu --expected-commit "$STAMP"
          python tools/ValidateTangentialGeometry.py "$EXE" gui-tangential-gpu.json gpu --expected-commit "$STAMP"
      - name: Denoise controls, durable history and exact export
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            EXE=build/bin/Release/JixelLight.exe
          else
            EXE=$(find build -path '*/JixelLight.app/Contents/MacOS/JixelLight' -type f | head -1)
          fi
          test -f "$EXE"
          STAMP=$(git rev-parse --short HEAD)
          python -m unittest discover -s tests -p 'TestDenoiseEvidence.py' -v
          python tools/ValidateDenoise.py "$EXE" gui-denoise-cpu.json cpu --expected-commit "$STAMP"
          python tools/ValidateDenoise.py "$EXE" gui-denoise-gpu.json gpu --expected-commit "$STAMP"
      - name: Signed clarity, durable history and exact export
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            EXE=build/bin/Release/JixelLight.exe
          else
            EXE=$(find build -path '*/JixelLight.app/Contents/MacOS/JixelLight' -type f | head -1)
          fi
          test -f "$EXE"
          STAMP=$(git rev-parse --short HEAD)
          python -m unittest discover -s tests -p 'TestClarityEvidence.py' -v
          python tools/ValidateClarity.py "$EXE" gui-clarity-cpu.json cpu --expected-commit "$STAMP"
          python tools/ValidateClarity.py "$EXE" gui-clarity-gpu.json gpu --expected-commit "$STAMP"
      - name: Texture controls, explicit CPU policy and exact export
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            EXE=build/bin/Release/JixelLight.exe
          else
            EXE=$(find build -path '*/JixelLight.app/Contents/MacOS/JixelLight' -type f | head -1)
          fi
          test -f "$EXE"
          STAMP=$(git rev-parse --short HEAD)
          python -m unittest discover -s tests -p 'TestTextureEvidence.py' -v
          python tools/ValidateTexture.py "$EXE" gui-texture-cpu.json cpu --expected-commit "$STAMP"
          python tools/ValidateTexture.py "$EXE" gui-texture-gpu.json gpu --expected-commit "$STAMP"
      - name: Dehaze controls, explicit CPU policy and exact export
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            EXE=build/bin/Release/JixelLight.exe
          else
            EXE=$(find build -path '*/JixelLight.app/Contents/MacOS/JixelLight' -type f | head -1)
          fi
          test -f "$EXE"
          STAMP=$(git rev-parse --short HEAD)
          python -m unittest discover -s tests -p 'TestDehazeEvidence.py' -v
          python tools/ValidateDehaze.py "$EXE" gui-dehaze-cpu.json cpu --expected-commit "$STAMP"
          python tools/ValidateDehaze.py "$EXE" gui-dehaze-gpu.json gpu --expected-commit "$STAMP"
      - name: Point Color picker, durable working selection and exact export
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            EXE=build/bin/Release/JixelLight.exe
          else
            EXE=$(find build -path '*/JixelLight.app/Contents/MacOS/JixelLight' -type f | head -1)
          fi
          test -f "$EXE"
          STAMP=$(git rev-parse --short HEAD)
          python -m unittest discover -s tests -p 'TestPointColorEvidence.py' -v
          python tools/ValidatePointColor.py "$EXE" gui-point-color-cpu.json cpu --expected-commit "$STAMP"
          python tools/ValidatePointColor.py "$EXE" gui-point-color-gpu.json gpu --expected-commit "$STAMP"
      - name: Luminance mask controls, durable range and exact export
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            EXE=build/bin/Release/JixelLight.exe
          else
            EXE=$(find build -path '*/JixelLight.app/Contents/MacOS/JixelLight' -type f | head -1)
          fi
          test -f "$EXE"
          STAMP=$(git rev-parse --short HEAD)
          python -m unittest discover -s tests -p 'TestLuminanceMaskEvidence.py' -v
          python tools/ValidateLuminanceMask.py "$EXE" gui-luminance-mask-cpu.json cpu --expected-commit "$STAMP"
          python tools/ValidateLuminanceMask.py "$EXE" gui-luminance-mask-gpu.json gpu --expected-commit "$STAMP"
      - name: Color range mask picker, durable selection and exact export
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            EXE=build/bin/Release/JixelLight.exe
          else
            EXE=$(find build -path '*/JixelLight.app/Contents/MacOS/JixelLight' -type f | head -1)
          fi
          test -f "$EXE"
          STAMP=$(git rev-parse --short HEAD)
          python -m unittest discover -s tests -p 'TestColorMaskEvidence.py' -v
          python tools/ValidateColorMask.py "$EXE" gui-color-mask-cpu.json cpu --expected-commit "$STAMP"
          python tools/ValidateColorMask.py "$EXE" gui-color-mask-gpu.json gpu --expected-commit "$STAMP"
      - name: Presentation-only soft proof and unchanged original export
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            EXE=build/bin/Release/JixelLight.exe
          else
            EXE=$(find build -path '*/JixelLight.app/Contents/MacOS/JixelLight' -type f | head -1)
          fi
          test -f "$EXE"
          STAMP=$(git rev-parse --short HEAD)
          python -m unittest discover -s tests -p 'TestSoftProofEvidence.py' -v
          python tools/ValidateSoftProof.py "$EXE" gui-soft-proof-cpu.json cpu --expected-commit "$STAMP"
          python tools/ValidateSoftProof.py "$EXE" gui-soft-proof-gpu.json gpu --expected-commit "$STAMP"
      - name: Owned move import, system trash and reviewed recovery
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            EXE=build/bin/Release/JixelLight.exe
          else
            EXE=$(find build -path '*/JixelLight.app/Contents/MacOS/JixelLight' -type f | head -1)
          fi
          test -f "$EXE"
          STAMP=$(git rev-parse --short HEAD)
          python -m unittest discover -s tests -p 'TestMoveImportEvidence.py' -v
          python tools/ValidateMoveImport.py "$EXE" gui-move-import-cpu.json cpu --expected-commit "$STAMP"
          python tools/ValidateMoveImport.py "$EXE" gui-move-import-gpu.json gpu --expected-commit "$STAMP"
      - name: Bilingual anchored project-menu layout
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            EXE=build/bin/Release/JixelLight.exe
          else
            EXE=$(find build -path '*/JixelLight.app/Contents/MacOS/JixelLight' -type f | head -1)
          fi
          test -f "$EXE"
          STAMP=$(git rev-parse --short HEAD)
          python -m unittest discover -s tests -p 'TestProjectMenuEvidence.py' -v
          python tools/ValidateProjectMenu.py "$EXE" gui-project-menu-layout.json --expected-commit "$STAMP"
      - name: Canvas local-mask pointer smoke (independent synthetic GUI)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            EXE=build/bin/Release/JixelLight.exe
          else
            EXE=$(find build -path '*/JixelLight.app/Contents/MacOS/JixelLight' -type f | head -1)
          fi
          test -f "$EXE"
          python tools/ValidateMaskCanvas.py "$EXE" gui-mask-canvas.json
          python tools/ValidateRelink.py "$EXE" gui-source-relink.json
          python tools/ValidateBrushCanvas.py "$EXE" gui-brush-cpu.json cpu
          python tools/ValidateBrushCanvas.py "$EXE" gui-brush-gpu.json gpu
          python tools/ValidateShortcutHelp.py "$EXE" gui-shortcut-help.json
      - name: Recipe dialog and isolated native clipboard
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            EXE=build/bin/Release/JixelLight.exe
            RECIPE_QPA=windows
          else
            EXE=$(find build -path '*/JixelLight.app/Contents/MacOS/JixelLight' -type f | head -1)
            RECIPE_QPA=cocoa
          fi
          test -f "$EXE"
          python tools/ValidateEditRecipe.py "$EXE" build/edit-recipe-native --expected-stamp "$(git rev-parse --short HEAD)" --qpa "$RECIPE_QPA" --dpr 1 --isolated-ci-native
      - name: Real Sony full-source brush pointer and exact waveform
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            EXE=build/bin/Release/JixelLight.exe
          else
            EXE=$(find build -path '*/JixelLight.app/Contents/MacOS/JixelLight' -type f | head -1)
          fi
          python tools/ValidateSonyBrushCanvas.py "$EXE" "$JIXELLIGHT_SONY_FIXTURES/sony_a7_iv_07.arw" gui-sony-brush-cpu.json cpu
          python tools/ValidateSonyBrushCanvas.py "$EXE" "$JIXELLIGHT_SONY_FIXTURES/sony_a7_iv_07.arw" gui-sony-brush-gpu.json gpu
      - name: Native ordered Paint Erase workflow and compact English controls
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            EXE=build/bin/Release/JixelLight.exe
          else
            EXE=$(find build -path '*/JixelLight.app/Contents/MacOS/JixelLight' -type f | head -1)
          fi
          python tools/ValidateBrushErase.py "$EXE" gui-brush-erase-cpu.json cpu
          python tools/ValidateBrushErase.py "$EXE" gui-brush-erase-gpu.json gpu
          python tools/ValidateBrushErase.py "$EXE" gui-transparent-brush-erase-cpu.json cpu --transparent
          python tools/ValidateBrushErase.py "$EXE" gui-transparent-brush-erase-gpu.json gpu --transparent
          python tools/ValidateBrushErase.py "$EXE" gui-sony-brush-erase-cpu.json cpu --sony "$JIXELLIGHT_SONY_FIXTURES/sony_a7_iv_07.arw"
          python tools/ValidateBrushErase.py "$EXE" gui-sony-brush-erase-gpu.json gpu --sony "$JIXELLIGHT_SONY_FIXTURES/sony_a7_iv_07.arw"
      - name: Controlled pressure Paint Erase and exact Sony export
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            EXE=build/bin/Release/JixelLight.exe
            VERIFY=build/bin/Release/JixelLightBrushPressureExportVerifier.exe
          else
            EXE=$(find build -path '*/JixelLight.app/Contents/MacOS/JixelLight' -type f | head -1)
            VERIFY=build/bin/JixelLightBrushPressureExportVerifier
          fi
          python -m unittest discover -s tests -p 'TestBrushPressureFailureEvidence.py' -v
          python tools/ValidateBrushPressure.py "$EXE" gui-brush-pressure-cpu.json cpu
          python tools/ValidateBrushPressure.py "$EXE" gui-brush-pressure-gpu.json gpu
          python tools/ValidateBrushPressure.py "$EXE" gui-transparent-brush-pressure-cpu.json cpu --transparent
          python tools/ValidateBrushPressure.py "$EXE" gui-transparent-brush-pressure-gpu.json gpu --transparent
          python tools/ValidateBrushPressure.py "$EXE" gui-sony-brush-pressure-cpu.json cpu --sony "$JIXELLIGHT_SONY_FIXTURES/sony_a7_iv_07.arw" --verifier "$VERIFY"
          python tools/ValidateBrushPressure.py "$EXE" gui-sony-brush-pressure-gpu.json gpu --sony "$JIXELLIGHT_SONY_FIXTURES/sony_a7_iv_07.arw" --verifier "$VERIFY"
          python tools/ValidateBrushPressureEdges.py "$EXE" gui-brush-pressure-edges-cpu.json cpu
          python tools/ValidateBrushPressureEdges.py "$EXE" gui-brush-pressure-edges-gpu.json gpu
          python tools/ValidateBrushPressureEdges.py "$EXE" gui-transparent-brush-pressure-edges-cpu.json cpu --transparent
          python tools/ValidateBrushPressureEdges.py "$EXE" gui-transparent-brush-pressure-edges-gpu.json gpu --transparent
      - name: Explicitly selected Sony pen stabilization and exact export
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            EXE=build/bin/Release/JixelLight.exe
            VERIFY=build/bin/Release/JixelLightBrushPressureExportVerifier.exe
          else
            EXE=$(find build -path '*/JixelLight.app/Contents/MacOS/JixelLight' -type f | head -1)
            VERIFY=build/bin/JixelLightBrushPressureExportVerifier
          fi
          python -m unittest discover -s tests -p 'TestSonyPenStabilizationValidation.py' -v
          python tools/ValidateBrushPressure.py "$EXE" gui-sony-stabilized-brush-pressure-cpu.json cpu --sony "$JIXELLIGHT_SONY_FIXTURES/sony_a7_iv_07.arw" --verifier "$VERIFY" --stabilized-sony
          python tools/ValidateBrushPressure.py "$EXE" gui-sony-stabilized-brush-pressure-gpu.json gpu --sony "$JIXELLIGHT_SONY_FIXTURES/sony_a7_iv_07.arw" --verifier "$VERIFY" --stabilized-sony
      - name: Explicit one-pixel Sony pen choice and exact export
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            EXE=build/bin/Release/JixelLight.exe
            VERIFY=build/bin/Release/JixelLightBrushPressureExportVerifier.exe
          else
            EXE=$(find build -path '*/JixelLight.app/Contents/MacOS/JixelLight' -type f | head -1)
            VERIFY=build/bin/JixelLightBrushPressureExportVerifier
          fi
          python -m unittest discover -s tests -p 'TestOnePixelSonyValidation.py' -v
          python tools/ValidateBrushPressure.py "$EXE" gui-sony-one-pixel-brush-pressure-cpu.json cpu --sony "$JIXELLIGHT_SONY_FIXTURES/sony_a7_iv_07.arw" --verifier "$VERIFY" --stabilized-sony --one-pixel
          python tools/ValidateBrushPressure.py "$EXE" gui-sony-one-pixel-brush-pressure-gpu.json gpu --sony "$JIXELLIGHT_SONY_FIXTURES/sony_a7_iv_07.arw" --verifier "$VERIFY" --stabilized-sony --one-pixel
      - name: Explicit prefix recovery on the actual photo canvas
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            EXE=build/bin/Release/JixelLight.exe
          else
            EXE=$(find build -path '*/JixelLight.app/Contents/MacOS/JixelLight' -type f | head -1)
          fi
          python -m unittest discover -s tests -p 'TestBrushRecoveryValidation.py' -v
          for MODE in cpu gpu; do
            for ACTION in paint erase; do
              ERASE_FLAG=
              if [ "$ACTION" = erase ]; then ERASE_FLAG=--erase; fi
              python tools/ValidateBrushRecovery.py "$EXE" "gui-brush-recovery-$ACTION-$MODE.json" "$MODE" $ERASE_FLAG
              python tools/ValidateBrushRecovery.py "$EXE" "gui-transparent-brush-recovery-$ACTION-$MODE.json" "$MODE" $ERASE_FLAG --transparent
            done
          done
      - name: Explicitly selected pen stabilization on the photo canvas
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            EXE=build/bin/Release/JixelLight.exe
          else
            EXE=$(find build -path '*/JixelLight.app/Contents/MacOS/JixelLight' -type f | head -1)
          fi
          python -m unittest discover -s tests -p 'TestBrushStabilizationValidation.py' -v
          for MODE in cpu gpu; do
            for ACTION in paint erase; do
              ERASE_FLAG=
              if [ "$ACTION" = erase ]; then ERASE_FLAG=--erase; fi
              python tools/ValidateBrushStabilization.py "$EXE" "gui-brush-stabilization-$ACTION-$MODE.json" "$MODE" $ERASE_FLAG
              python tools/ValidateBrushStabilization.py "$EXE" "gui-transparent-brush-stabilization-$ACTION-$MODE.json" "$MODE" $ERASE_FLAG --transparent
            done
          done
      - name: Explicit one-pixel pen choice on the photo canvas
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            EXE=build/bin/Release/JixelLight.exe
          else
            EXE=$(find build -path '*/JixelLight.app/Contents/MacOS/JixelLight' -type f | head -1)
          fi
          python -m unittest discover -s tests -p 'TestOnePixelBrushValidation.py' -v
          for MODE in cpu gpu; do
            for ACTION in paint erase; do
              ERASE_FLAG=
              if [ "$ACTION" = erase ]; then ERASE_FLAG=--erase; fi
              python tools/ValidateBrushStabilization.py "$EXE" "gui-one-pixel-brush-stabilization-$ACTION-$MODE.json" "$MODE" $ERASE_FLAG --one-pixel
              python tools/ValidateBrushStabilization.py "$EXE" "gui-transparent-one-pixel-brush-stabilization-$ACTION-$MODE.json" "$MODE" $ERASE_FLAG --transparent --one-pixel
            done
          done
      - name: Real RAW JPEG CPU GPU render matrix
        shell: bash
        env:
          JIXELLIGHT_REQUIRE_GPU: '1'
        run: |
          MATRIX=$(find build/bin -type f \( -name JixelLightRawRenderMatrix -o -name JixelLightRawRenderMatrix.exe \) | head -1)
          test -n "$MATRIX"
          rm -rf build/raw-render-matrix
          "$MATRIX" "$JIXELLIGHT_SONY_FIXTURES" build/raw-render-matrix > raw-render-matrix.log
      - name: Stage 6C real-sensor evidence and calibration refusal gate
        shell: bash
        run: |
          python -m unittest discover -s tests -p 'TestSensorEvidence.py' -v
          python tools/ValidateSensorEvidence.py tests/fixtures/sony-real-manifest.json build/raw-render-matrix/raw-render-matrix.json build/sensor-evidence.json
      - name: Stage 6C.2 research-only FP32 trial/readiness safety
        shell: bash
        run: |
          TRIAL=$(find build/bin -type f \( -name JixelLightFloatRawTrial -o -name JixelLightFloatRawTrial.exe \) | head -1)
          test -n "$TRIAL"
          python tools/ValidateFloatRawTrial.py "$TRIAL" build/sensor-evidence.json build/float-raw-readiness.json
      - name: Stage 6C.3 verified offline unpacked RAW/JPEG compatibility probe
        shell: bash
        run: |
          PROBE=$(find build/bin -type f \( -name JixelLightOfflineRawProbe -o -name JixelLightOfflineRawProbe.exe \) | head -1)
          test -n "$PROBE"
          python tools/ValidateOfflineRawProbe.py "$PROBE" tests/fixtures/sony-real-manifest.json "$JIXELLIGHT_SONY_FIXTURES" build/offline-raw-probe.json
      - name: Require Direct3D compute and display-ICC validation (WARP)
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.compile.outcome == 'success' }}
        shell: pwsh
        env:
          JIXELLIGHT_REQUIRE_GPU: '1'
        run: |
          & ./build/bin/Release/JixelLightGpuTests.exe -o gpu-validation.txt,txt
          $gpuResult = $LASTEXITCODE
          if (Test-Path gpu-validation.txt) { Get-Content gpu-validation.txt }
          if ($gpuResult -ne 0) { throw 'D3D11 compute validation failed' }
          & ./build/bin/Release/JixelLightDisplayColorGpuTests.exe -o display-color-gpu-validation.txt,txt
          $displayResult = $LASTEXITCODE
          if (Test-Path display-color-gpu-validation.txt) { Get-Content display-color-gpu-validation.txt }
          if ($displayResult -ne 0) { throw 'D3D11 display ICC validation failed' }
      - name: Require Metal compute and display-ICC validation
        if: ${{ !cancelled() && runner.os == 'macOS' && steps.compile.outcome == 'success' }}
        shell: bash
        env:
          JIXELLIGHT_REQUIRE_GPU: '1'
        run: |
          status=0
          ./build/bin/JixelLightGpuTests -o gpu-validation.txt,txt || status=$?
          cat gpu-validation.txt
          test "$status" -eq 0 || exit "$status"
          ./build/bin/JixelLightDisplayColorGpuTests -o display-color-gpu-validation.txt,txt || status=$?
          cat display-color-gpu-validation.txt
          exit "$status"
      - name: GUI Direct3D integration (WARP)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          QSG_RHI_BACKEND: d3d11
          QSG_RHI_PREFER_SOFTWARE_RENDERER: '1'
          JIXELLIGHT_REQUIRE_GPU: '1'
        run: |
          $process = Start-Process -FilePath ./build/bin/Release/JixelLight.exe -ArgumentList @('--smoke-report','gui-gpu.json','--screenshot','gui-gpu.png',"$env:RUNNER_TEMP/JixelLight-test.DNG") -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw 'GUI Direct3D validation failed' }
          python tools/ValidateDiagnostic.py ./build/bin/Release/JixelLight.exe --mode gpu --cli ./build/bin/Release/JixelLightCli.exe
          if ($LASTEXITCODE -ne 0) { throw 'GUI Direct3D diagnostic capture failed' }
      - name: GUI Metal integration
        if: runner.os == 'macOS'
        shell: bash
        env:
          QSG_RHI_BACKEND: metal
          JIXELLIGHT_REQUIRE_GPU: '1'
        run: |
          APP=$(find build -name JixelLight.app -type d | head -1)
          test -n "$APP"
          "$APP/Contents/MacOS/JixelLight" --smoke-report gui-gpu.json --screenshot gui-gpu.png "$RUNNER_TEMP/JixelLight-test.DNG"
          python tools/ValidateDiagnostic.py "$APP/Contents/MacOS/JixelLight" --mode gpu --cli ./build/bin/JixelLightCli
      - name: Synthetic CPU benchmark
        shell: bash
        run: |
          BENCH=$(find build/bin -type f \( -name JixelLightBenchmark -o -name JixelLightBenchmark.exe \) | head -1)
          test -n "$BENCH"
          "$BENCH" > benchmark.json
      - name: Print validation summaries
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys
          sys.stdout.reconfigure(encoding='utf-8', errors='replace')
          paths = sorted(Path('build').glob('*-results.txt'))
          paths += [Path('gpu-validation.txt'),Path('display-color-gpu-validation.txt'),Path('gui-gpu.json'),Path('benchmark.json'),Path('raw-render-matrix.log'),Path('build/raw-render-matrix/raw-render-matrix.json'),Path('build/sensor-evidence.json'),Path('build/float-raw-readiness.json'),Path('build/offline-raw-probe.json'),Path('build/cross-raw-conformance.json')]
          for path in paths:
              if path.is_file():
                  print('\n=== ' + str(path) + ' ===', flush=True)
                  print(path.read_text(encoding='utf-8-sig', errors='replace')[:50000], flush=True)
          PY
      - name: Deploy and validate Windows package
        id: package_windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path build -Recurse -Filter JixelLight.exe | Select-Object -First 1
          if (-not $exe) { throw 'JixelLight.exe not found' }
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item $exe.FullName package/JixelLight.exe
          $probe = Get-ChildItem -Path build/bin -Recurse -Filter JixelLightSonyValidation.exe | Select-Object -First 1
          Copy-Item $probe.FullName package/JixelLightSonyValidation.exe
          $cli = Get-ChildItem -Path build/bin -Recurse -Filter JixelLightCli.exe | Select-Object -First 1
          if (-not $cli) { throw 'JixelLightCli.exe not found' }
          Copy-Item $cli.FullName package/JixelLightCli.exe
          $pressureVerifier = Get-ChildItem -Path build/bin -Recurse -Filter JixelLightBrushPressureExportVerifier.exe | Select-Object -First 1
          if (-not $pressureVerifier) { throw 'Pressure export verifier not found' }
          Copy-Item $pressureVerifier.FullName package/JixelLightBrushPressureExportVerifier.exe
          New-Item -ItemType Directory -Force -Path package/profiles | Out-Null
          Copy-Item build/sony-real-reports/dataset/empirical.jlook.json package/profiles/Sony-ILCE7M4-ST-experimental.jlook.json
          Copy-Item docs/SONY_REAL_VALIDATION.md package/profiles/README.md
          windeployqt --release --qmldir ui package/JixelLight.exe
          if ($LASTEXITCODE -ne 0) { throw 'windeployqt failed' }
          python tools/ValidatePackage.py package/JixelLight.exe "$env:RUNNER_TEMP/JixelLight-test.DNG" --sony-probe package/JixelLightSonyValidation.exe --cli package/JixelLightCli.exe --sony-brush-raw "$env:JIXELLIGHT_SONY_FIXTURES/sony_a7_iv_07.arw" --pressure-export-verifier package/JixelLightBrushPressureExportVerifier.exe
          if ($LASTEXITCODE -ne 0) { throw 'Deployed Windows package validation failed' }
          Copy-Item package-validation/manifest.json package/validation-manifest.json
          Compress-Archive -Path package/* -DestinationPath JixelLight-Windows-x64.zip -Force
          Get-FileHash JixelLight-Windows-x64.zip -Algorithm SHA256 | Format-List
      - name: Deploy and validate macOS package
        id: package_macos
        if: runner.os == 'macOS'
        shell: bash
        run: |
          APP=$(find build -name JixelLight.app -type d | head -1)
          test -n "$APP"
          cp build/bin/JixelLightSonyValidation "$APP/Contents/MacOS/JixelLightSonyValidation"
          cp build/bin/JixelLightCli "$APP/Contents/MacOS/JixelLightCli"
          cp build/bin/JixelLightBrushPressureExportVerifier "$APP/Contents/MacOS/JixelLightBrushPressureExportVerifier"
          mkdir -p "$APP/Contents/Resources/profiles"
          cp build/sony-real-reports/dataset/empirical.jlook.json "$APP/Contents/Resources/profiles/Sony-ILCE7M4-ST-experimental.jlook.json"
          cp docs/SONY_REAL_VALIDATION.md "$APP/Contents/Resources/profiles/README.md"
          macdeployqt "$APP" -qmldir=ui -executable="$APP/Contents/MacOS/JixelLightSonyValidation" -executable="$APP/Contents/MacOS/JixelLightCli" -executable="$APP/Contents/MacOS/JixelLightBrushPressureExportVerifier"
          python tools/ValidatePackage.py "$APP/Contents/MacOS/JixelLight" "$RUNNER_TEMP/JixelLight-test.DNG" --sony-probe "$APP/Contents/MacOS/JixelLightSonyValidation" --cli "$APP/Contents/MacOS/JixelLightCli" --sony-brush-raw "$JIXELLIGHT_SONY_FIXTURES/sony_a7_iv_07.arw" --pressure-export-verifier "$APP/Contents/MacOS/JixelLightBrushPressureExportVerifier"
          ditto -c -k --sequesterRsrc --keepParent "$APP" JixelLight-macOS-arm64.zip
          shasum -a 256 JixelLight-macOS-arm64.zip
      - name: Upload validation reports
        id: validation_upload
        if: always()
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/upload-artifact@v4
        with:
          name: validation-${{ runner.os }}
          path: ${{ env.JIXELLIGHT_VALIDATION_ARTIFACT_PATHS }}
          if-no-files-found: error
      - name: Upload validation reports transport retry 1
        id: validation_upload_retry
        if: ${{ !cancelled() && (steps.validation_upload.outcome == 'failure' || steps.validation_upload.outcome == 'cancelled') }}
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/upload-artifact@v4
        with:
          name: validation-${{ runner.os }}-transport-retry1
          path: ${{ env.JIXELLIGHT_VALIDATION_ARTIFACT_PATHS }}
          if-no-files-found: error
      - name: Upload packaging validation
        id: package_upload
        if: always()
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/upload-artifact@v4
        with:
          name: package-validation-${{ runner.os }}
          path: package-validation
          if-no-files-found: error
      - name: Upload packaging validation transport retry 1
        id: package_upload_retry
        if: ${{ !cancelled() && (steps.package_upload.outcome == 'failure' || steps.package_upload.outcome == 'cancelled') }}
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/upload-artifact@v4
        with:
          name: package-validation-${{ runner.os }}-transport-retry1
          path: package-validation
          if-no-files-found: error
      - name: Upload Windows artifact
        id: shipping_windows
        if: ${{ !cancelled() && steps.package_windows.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: JixelLight-Windows-x64.zip
          if-no-files-found: error
      - name: Upload Windows artifact transport retry 1
        id: shipping_windows_retry
        if: ${{ !cancelled() && (steps.shipping_windows.outcome == 'failure' || steps.shipping_windows.outcome == 'cancelled') }}
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-transport-retry1
          path: JixelLight-Windows-x64.zip
          if-no-files-found: error
      - name: Upload macOS artifact
        id: shipping_macos
        if: ${{ !cancelled() && steps.package_macos.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: JixelLight-macOS-arm64.zip
          if-no-files-found: error
      - name: Upload macOS artifact transport retry 1
        id: shipping_macos_retry
        if: ${{ !cancelled() && (steps.shipping_macos.outcome == 'failure' || steps.shipping_macos.outcome == 'cancelled') }}
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-transport-retry1
          path: JixelLight-macOS-arm64.zip
          if-no-files-found: error
      - name: Require product success and complete artifact delivery
        if: ${{ always() && !cancelled() }}
        shell: bash
        env:
          JIXELLIGHT_PRIOR_JOB_STATUS: ${{ job.status }}
          JIXELLIGHT_PACKAGE_GATE: ${{ runner.os == 'Windows' && steps.package_windows.outcome || steps.package_macos.outcome }}
          JIXELLIGHT_ARTIFACT_DELIVERY: |
            {
              "validation": {
                "primary": {
                  "outcome": "${{ steps.validation_upload.outcome }}",
                  "id": "${{ steps.validation_upload.outputs.artifact-id }}",
                  "digest": "${{ steps.validation_upload.outputs.artifact-digest }}"
                },
                "retry": {
                  "outcome": "${{ steps.validation_upload_retry.outcome }}",
                  "id": "${{ steps.validation_upload_retry.outputs.artifact-id }}",
                  "digest": "${{ steps.validation_upload_retry.outputs.artifact-digest }}"
                }
              },
              "package": {
                "primary": {
                  "outcome": "${{ steps.package_upload.outcome }}",
                  "id": "${{ steps.package_upload.outputs.artifact-id }}",
                  "digest": "${{ steps.package_upload.outputs.artifact-digest }}"
                },
                "retry": {
                  "outcome": "${{ steps.package_upload_retry.outcome }}",
                  "id": "${{ steps.package_upload_retry.outputs.artifact-id }}",
                  "digest": "${{ steps.package_upload_retry.outputs.artifact-digest }}"
                }
              },
              "shipping": {
                "primary": {
                  "outcome": "${{ runner.os == 'Windows' && steps.shipping_windows.outcome || steps.shipping_macos.outcome }}",
                  "id": "${{ runner.os == 'Windows' && steps.shipping_windows.outputs.artifact-id || steps.shipping_macos.outputs.artifact-id }}",
                  "digest": "${{ runner.os == 'Windows' && steps.shipping_windows.outputs.artifact-digest || steps.shipping_macos.outputs.artifact-digest }}"
                },
                "retry": {
                  "outcome": "${{ runner.os == 'Windows' && steps.shipping_windows_retry.outcome || steps.shipping_macos_retry.outcome }}",
                  "id": "${{ runner.os == 'Windows' && steps.shipping_windows_retry.outputs.artifact-id || steps.shipping_macos_retry.outputs.artifact-id }}",
                  "digest": "${{ runner.os == 'Windows' && steps.shipping_windows_retry.outputs.artifact-digest || steps.shipping_macos_retry.outputs.artifact-digest }}"
                }
              }
            }
        run: |
          python tools/ValidateArtifactDelivery.py --platform "$RUNNER_OS" --prior-job-status "$JIXELLIGHT_PRIOR_JOB_STATUS" --package-gate "$JIXELLIGHT_PACKAGE_GATE" --report artifact-delivery.json
  linux-gpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      JIXELLIGHT_VALIDATION_ARTIFACT_PATHS: |
        build/*-results.txt
        build/brush-preview-admission-worker-results.json
        build/brush-tile-lowerbound-owned
        build/tangential-geometry-owned
        build/tangential-gpu-owned
        build/grain-owned
        build/sharpen-owned
        build/denoise-owned
        build/clarity-owned
        build/texture-owned
        build/dehaze-owned
        build/color-mask-owned
        build/luminance-mask-owned
        build/point-color-owned
        build/native-brush-monitor.json
        build/xmp-controller-native/
        build/brush-pressure-input/
        build/edit-recipe-native/
        build/qsb-depfile-test/
        build/tests.xml
        build/sony-real-reports/
        build/gpu-preflight-reports/
        build/raw-render-matrix/
        build/sensor-evidence.json
        build/float-raw-readiness.json
        build/offline-raw-probe.json
        build/cross-raw-conformance*
        build/Testing/Temporary/LastTest.log
        gui-*.json
        gui-*.png
        gui-*.log
        gui-xmp-merge-*.json.stdout
        gui-xmp-merge-*.json.stderr
        gui-project-menu-layout.json.stdout
        gui-project-menu-layout.json.stderr
        gui-raw-qpa-*
        gui-tangential-*
        gui-denoise-*
        gui-clarity-*
        gui-texture-*
        gui-dehaze-*
        gui-move-import-*
        gui-soft-proof-*
        gui-color-mask-*
        gui-luminance-mask-*
        gui-point-color-*
        diagnostic-validation/
        raw-render-matrix.log
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Validate strict artifact-delivery gate
        shell: bash
        run: python -m unittest discover -s tests -p 'TestArtifactDelivery.py' -v
      - name: Native dependencies and headless GPU validation
        run: |
          # The runner's Azure mirror failed DNS before any product build in CI364.
          # Keep the Ubuntu suites/signature checks, using the primary archive.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's#azure\.archive\.ubuntu\.com/#archive.ubuntu.com/#g' /etc/apt/apt-mirrors.txt
          fi
          native_apt_options=(-o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15)
          sudo apt-get "${native_apt_options[@]}" update -qq
          sudo apt-get "${native_apt_options[@]}" install -y libraw-dev liblcms2-dev libexiv2-dev libjpeg-dev libgl-dev libegl-dev libopengl-dev libvulkan-dev libxkbcommon-dev libxcb-cursor0 xvfb mesa-utils fonts-noto-cjk
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          modules: qtshadertools qtimageformats
          cache: true
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 4
      - name: RAW fixture
        run: curl -L --fail --retry 3 https://raw.githubusercontent.com/f-spot/raw-samples/master/DNG/RAW_LEICA_M8.DNG -o "$RUNNER_TEMP/test.DNG"
      - name: Fetch checksum-pinned real Sony ARW and matching JPEG fixtures
        shell: bash
        run: python tools/FetchSonyFixtures.py tests/fixtures/sony-real-manifest.json "$JIXELLIGHT_SONY_FIXTURES"
      - name: Cache pinned CC0 CR3 NEF and RAF fixtures
        uses: actions/cache@v4
        with:
          path: .cross-raw-fixtures
          key: cross-raw-${{ runner.os }}-${{ hashFiles('tests/fixtures/cross-raw.json') }}
      - name: Fetch checksum-pinned CC0 cross-format RAW fixtures
        shell: bash
        run: python tools/FetchCrossRawFixtures.py tests/fixtures/cross-raw.json "$JIXELLIGHT_CROSS_RAW_FIXTURES"
      - name: Real Sony and complete GPU precision preflight
        env:
          QT_QPA_PLATFORM: offscreen
          LIBGL_ALWAYS_SOFTWARE: '1'
          JIXELLIGHT_REQUIRE_GPU: '1'
          JIXELLIGHT_TEST_RAW: ${{ runner.temp }}/test.DNG
        run: |
          python -m unittest discover -s tests -p 'TestGpuPreflight.py' -v
          STAMP=$(git rev-parse HEAD)
          xvfb-run -a python tools/RunGpuPreflight.py --build build --report build/gpu-preflight-reports --source-commit "$STAMP"
      - name: Tests (GPU must not be skipped)
        env:
          QT_QPA_PLATFORM: offscreen
          LIBGL_ALWAYS_SOFTWARE: '1'
          JIXELLIGHT_REQUIRE_GPU: '1'
          JIXELLIGHT_TEST_RAW: ${{ runner.temp }}/test.DNG
        run: xvfb-run -a ctest --test-dir build --output-on-failure --output-junit tests.xml
      - name: Native committed preview delivery monitor and exact Sony export
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          STAMP=$(git rev-parse --short HEAD)
          python -m unittest discover -s tests -p 'TestNativeBrushEvidence.py' -v
          for CASE in route delivery pending retired-render monitor; do
            xvfb-run -a python tools/ValidateNativeBrush.py ./build/bin/JixelLight "gui-native-brush-$CASE.json" "$CASE" --expected-commit "$STAMP"
          done
          xvfb-run -a python tools/ValidateNativeBrush.py ./build/bin/JixelLight gui-native-brush-sony.json sony --raw "$JIXELLIGHT_SONY_FIXTURES/sony_a7_iv_07.arw" --verifier ./build/bin/JixelLightBrushPressureExportVerifier --expected-commit "$STAMP"
      - name: Bilingual normal-App XMP review and durable import
        run: |
          STAMP=$(git rev-parse --short HEAD)
          python -m unittest discover -s tests -p 'TestXmpMergeEvidence.py' -v
          for LANGUAGE in en_US zh_CN; do
            xvfb-run -a python tools/ValidateXmpMerge.py ./build/bin/JixelLight "gui-xmp-merge-$LANGUAGE.json" "$LANGUAGE" --expected-commit "$STAMP"
          done
      - name: Finite raw pressure QPA Paint and Erase
        shell: bash
        run: |
          EXE=build/bin/JixelLight
          test -f "$EXE"
          STAMP=$(git rev-parse --short HEAD)
          python -m unittest discover -s tests -p 'TestRawPressureQpaEvidence.py' -v
          python -m unittest discover -s tests -p 'TestPngUnfilter.py' -v
          python tools/ValidateRawPressureQpa.py "$EXE" gui-raw-qpa-cpu.json cpu --expected-commit "$STAMP"
          python tools/ValidateRawPressureQpa.py "$EXE" gui-raw-qpa-gpu.json gpu --expected-commit "$STAMP"
      - name: Manual tangential geometry complete photo App
        shell: bash
        run: |
          EXE=build/bin/JixelLight
          test -f "$EXE"
          STAMP=$(git rev-parse --short HEAD)
          python -m unittest discover -s tests -p 'TestTangentialGeometryEvidence.py' -v
          python tools/ValidateTangentialGeometry.py "$EXE" gui-tangential-cpu.json cpu --expected-commit "$STAMP"
          python tools/ValidateTangentialGeometry.py "$EXE" gui-tangential-gpu.json gpu --expected-commit "$STAMP"
      - name: Denoise controls, durable history and exact export
        shell: bash
        run: |
          EXE=build/bin/JixelLight
          test -f "$EXE"
          STAMP=$(git rev-parse --short HEAD)
          python -m unittest discover -s tests -p 'TestDenoiseEvidence.py' -v
          python tools/ValidateDenoise.py "$EXE" gui-denoise-cpu.json cpu --expected-commit "$STAMP"
          python tools/ValidateDenoise.py "$EXE" gui-denoise-gpu.json gpu --expected-commit "$STAMP"
      - name: Signed clarity, durable history and exact export
        shell: bash
        run: |
          EXE=build/bin/JixelLight
          test -f "$EXE"
