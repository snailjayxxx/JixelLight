name: alpha10-cuberoot-parity-fix
on:
  push:
    branches: [feature/sony-creative-look]
    paths: [.github/workflows/alpha10-cuberoot-parity-fix.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Unify Oklab cube-root arithmetic
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          expected='aa64cd4258542a9501d073175ebcbe33529e11f8'
          parent=subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip()
          if parent != expected:
              raise SystemExit(f'Unexpected parent {parent}; refusing concurrent overwrite')
          p=Path('core/pipeline/ImagePipeline.cpp'); t=p.read_text()
          marker='''inline float chromaLength(float a, float b) {\n    // Match the compute shader's explicit float sqrt path. std::hypot uses a\n    // scaled algorithm whose last-bit differences become visible after the\n    // alpha.10 RAW scene-placement gain near an sRGB gamut intersection.\n    const float aa = a * a;\n    const float bb = b * b;\n    return std::sqrt(aa + bb);\n}\n'''
          helper=marker+'''inline float stableCubeRoot(float value) {\n    // Keep the Oklab nonlinear primitive structurally identical to the\n    // compute shader. A library cbrt and a shader pow approximation can each\n    // be accurate while landing on different float results after the large\n    // alpha.10 RAW scene-placement gain. Fixed Newton refinements remove that\n    // backend-specific algorithm choice without changing the color model.\n    const float magnitude = std::fabs(value);\n    if (magnitude == 0.0f) return 0.0f;\n    float root = std::pow(magnitude, 1.0f / 3.0f);\n    root = (2.0f * root + magnitude / (root * root)) / 3.0f;\n    root = (2.0f * root + magnitude / (root * root)) / 3.0f;\n    return std::copysign(root, value);\n}\n'''
          if t.count(marker)!=1: raise SystemExit('CPU helper marker mismatch')
          t=t.replace(marker,helper)
          for old,new in [('std::cbrt(l)','stableCubeRoot(l)'),('std::cbrt(m)','stableCubeRoot(m)'),('std::cbrt(s)','stableCubeRoot(s)')]:
              if t.count(old)!=1: raise SystemExit('Unexpected '+old+' count')
              t=t.replace(old,new)
          p.write_text(t)
          PY
          git diff --check
          git diff -- core/pipeline/ImagePipeline.cpp
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add core/pipeline/ImagePipeline.cpp
          git commit -m 'fix: share Oklab cube-root arithmetic across CPU and GPU'
          git push origin HEAD:refs/heads/feature/sony-creative-look
