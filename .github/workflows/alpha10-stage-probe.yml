name: alpha10-stage-probe
on:
  push:
    branches: [feature/sony-creative-look]
    paths: [.github/workflows/alpha10-stage-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Install native dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libraw-dev liblcms2-dev libexiv2-dev libjpeg-dev libgl-dev libegl-dev libopengl-dev libvulkan-dev libxkbcommon-dev libxcb-cursor0 xvfb mesa-utils
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          modules: qtshadertools
          cache: true
      - name: Apply diagnostic patch in CI checkout only
        run: |
          python tools/Alpha10StageProbePatch.py
          git diff --check
      - name: Build GPU probe
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target JixelLightGpuTests --parallel 4
      - name: Run per-stage probe
        env:
          QT_QPA_PLATFORM: offscreen
          LIBGL_ALWAYS_SOFTWARE: '1'
          JIXELLIGHT_REQUIRE_GPU: '1'
        run: |
          set +e
          xvfb-run -a ./build/bin/JixelLightGpuTests stageProbe -o probe.txt,txt
          status=$?
          cat probe.txt
          exit $status
      - name: Upload probe log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha10-stage-probe
          path: probe.txt
          if-no-files-found: error
